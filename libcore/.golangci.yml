linters:
  disable-all: true
  enable:
    - govet
    - staticcheck

run:
  build-tags:
    - "with_gvisor"
    - "with_quic"
    - "with_utls"
    - "with_clash_api"
    - "with_xhttp"
  go: "1.26"

issues:
  exclude-dirs:
    - "cmd/"

linters-settings:
  gci:
    custom-order: true
    sections:
      - standard
      - prefix(github.com/sagernet/)
      - default
