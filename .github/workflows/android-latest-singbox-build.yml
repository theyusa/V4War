name: Android Build (Latest sing-box)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build
        required: true
        default: main
        type: string
      singbox_version:
        description: sing-box version (use "latest" for newest)
        required: true
        default: latest
        type: string
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read

jobs:
  detect-singbox:
    name: Detect sing-box version
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.detect.outputs.current }}
      latest: ${{ steps.detect.outputs.latest }}
      target: ${{ steps.detect.outputs.target }}
      requested: ${{ steps.detect.outputs.requested }}
      build_ref: ${{ steps.ref.outputs.build_ref }}
    steps:
      - name: Resolve build ref
        id: ref
        run: |
          build_ref="${{ github.event.inputs.ref || 'main' }}"
          echo "build_ref=${build_ref}" >> "$GITHUB_OUTPUT"

      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.build_ref }}
          fetch-depth: 1
          submodules: recursive

      - name: Resolve Go version
        id: go-version
        run: |
          source buildScript/init/version.sh
          echo "go_version=$GO_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go-version.outputs.go_version }}
          cache-dependency-path: libcore/go.sum

      - name: Detect current/latest/target sing-box
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          cd libcore
          current=$(go list -m -f '{{.Version}}' github.com/sagernet/sing-box)
          latest=$(go list -m -f '{{.Version}}' github.com/sagernet/sing-box@latest)

          requested="${{ github.event.inputs.singbox_version || 'latest' }}"
          if [ "$requested" = "latest" ]; then
            target="$latest"
          else
            target="$requested"
          fi

          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "requested=$requested" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "## sing-box Detection"
            echo
            echo "- Build ref: \`${{ steps.ref.outputs.build_ref }}\`"
            echo "- Current: \`${{ steps.detect.outputs.current }}\`"
            echo "- Latest: \`${{ steps.detect.outputs.latest }}\`"
            echo "- Requested: \`${{ steps.detect.outputs.requested }}\`"
            echo "- Target: \`${{ steps.detect.outputs.target }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-android:
    name: Build APK with target sing-box
    runs-on: ubuntu-latest
    needs: detect-singbox
    env:
      KEYSTORE_PASS: android
      ALIAS_NAME: androiddebugkey
      ALIAS_PASS: android
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect-singbox.outputs.build_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Resolve Go version
        id: go-version
        run: |
          source buildScript/init/version.sh
          echo "go_version=$GO_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go-version.outputs.go_version }}
          cache-dependency-path: libcore/go.sum

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          add-to-path: true
          ndk-version: r29
          local-cache: false

      - name: Resolve cronet-go version
        id: cronet-go-version
        run: |
          echo "version=$(tr -d '[:space:]' < .github/CRONET_GO_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Checkout cronet-go
        uses: actions/checkout@v4
        with:
          repository: sagernet/cronet-go
          ref: ${{ steps.cronet-go-version.outputs.version }}
          path: cronet-go
          submodules: recursive
          fetch-depth: 1

      - name: Cache Chromium toolchain
        uses: actions/cache@v4
        with:
          path: |
            cronet-go/naiveproxy/src/third_party/llvm-build/
            cronet-go/naiveproxy/src/gn/out/
            cronet-go/naiveproxy/src/chrome/build/pgo_profiles/
            cronet-go/naiveproxy/src/out/sysroot-build/
          key: cronet-toolchain-linux-amd64-${{ steps.cronet-go-version.outputs.version }}

      - name: Download Chromium toolchain
        run: |
          set -xeuo pipefail
          rm -f "$GITHUB_WORKSPACE/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg"
          cd "$GITHUB_WORKSPACE/cronet-go"
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh
          go run ./cmd/build-naive --target=linux/amd64 download-toolchain

      - name: Upgrade sing-box dependency
        id: upgrade-singbox
        shell: bash
        run: |
          set -euo pipefail
          cd libcore
          go get github.com/sagernet/sing-box@${{ needs.detect-singbox.outputs.target }}
          go mod tidy
          go mod download
          resolved=$(go list -m -f '{{.Version}}' github.com/sagernet/sing-box)
          echo "resolved=$resolved" >> "$GITHUB_OUTPUT"

      - name: Show dependency diff
        run: |
          git diff -- libcore/go.mod libcore/go.sum | tee singbox-update.diff

      - name: Build libcore artifacts
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export CRONET_GO_ROOT="$GITHUB_WORKSPACE/cronet-go"
          bash buildScript/lib/core.sh --android

      - name: Create local.properties
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "KEYSTORE_PASS=${KEYSTORE_PASS}" >> local.properties
          echo "ALIAS_NAME=${ALIAS_NAME}" >> local.properties
          echo "ALIAS_PASS=${ALIAS_PASS}" >> local.properties

      - name: Prepare Gradle assets
        run: |
          bash buildScript/init/action/gradle.sh

      - name: Export library definitions
        run: |
          ./gradlew :composeApp:exportLibraryDefinitions

      - name: Build signed FOSS APK
        env:
          BUILD_PLUGIN: none
        run: |
          ./gradlew clean androidApp:assembleFossRelease --stacktrace

      - name: Collect arm64-v8a APK
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/foss/release/*arm64-v8a*.apk dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v4war-singbox-${{ steps.upgrade-singbox.outputs.resolved }}
          path: |
            dist/*.apk
            libcore/go.mod
            libcore/go.sum
            singbox-update.diff
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        run: |
          {
            echo "## Build with Updated sing-box"
            echo
            echo "- Ref: \`${{ needs.detect-singbox.outputs.build_ref }}\`"
            echo "- Previous: \`${{ needs.detect-singbox.outputs.current }}\`"
            echo "- Latest detected: \`${{ needs.detect-singbox.outputs.latest }}\`"
            echo "- Target requested: \`${{ needs.detect-singbox.outputs.target }}\`"
            echo "- Resolved in go.mod: \`${{ steps.upgrade-singbox.outputs.resolved }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
